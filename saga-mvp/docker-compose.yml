version: "3.9"

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - saga-net

  provider:
    build: ./saga-provider
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: saga
      PROVIDER_KEY_FILE: /keys/provider_signing_key.seed
    volumes:
      - ./certs:/certs:ro
      - provider_keys:/keys
    ports:
      - "8443:8443"
    networks:
      - saga-net

  alice-agent:
    build: ./agent
    depends_on:
      - provider
    environment:
      AGENT_UID: alice
      AGENT_NAME: calendar_agent
      AGENT_PORT: 9001
      PROVIDER_URL: https://provider:8443
      PROVIDER_VERIFY_TLS: "false"
    volumes:
      - ./certs/agent.crt:/certs/agent.crt:ro
      - ./certs/agent.key:/certs/agent.key:ro
      - ./saga-provider/seed-keys:/keys:ro
    ports:
      - "9001:9001"
    networks:
      - saga-net

  bob-agent:
    build: ./agent
    depends_on:
      - provider
    environment:
      AGENT_UID: bob
      AGENT_NAME: calendar_agent
      AGENT_PORT: 9002
      PROVIDER_URL: https://provider:8443
      PROVIDER_VERIFY_TLS: "false"
    volumes:
      - ./certs/agent.crt:/certs/agent.crt:ro
      - ./certs/agent.key:/certs/agent.key:ro
      - ./saga-provider/seed-keys:/keys:ro
    ports:
      - "9002:9002"
    networks:
      - saga-net

networks:
  saga-net:
    driver: bridge

volumes:
  mongo_data:
  provider_keys:
